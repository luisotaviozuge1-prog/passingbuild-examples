name: example
'on': push
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
    - name: Set result
      id: result-step
      run: echo "result=success" >> "$GITHUB_OUTPUT"
    - name: Use result
      run: echo "Result was $RESULT"
      env:
        RESULT: ${{ steps.result-step.outputs.result }}
