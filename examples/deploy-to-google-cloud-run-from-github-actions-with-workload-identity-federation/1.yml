name: Deploy to Cloud Run
'on':
  push:
    branches:
    - main
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: projects/123456789012/locations/global/workloadIdentityPools/github-pool/providers/github-provider
        service_account: github-actions-cloud-run@my-gcp-project-id.iam.gserviceaccount.com
    - name: Deploy to Cloud Run
      id: deploy
      uses: google-github-actions/deploy-cloudrun@v3
      with:
        service: sample-app
        region: us-central1
        image: us-central1-docker.pkg.dev/my-gcp-project-id/sample-repo/sample-app:latest
    - name: Print service URL
      run: echo "${{ steps.deploy.outputs.url }}"
