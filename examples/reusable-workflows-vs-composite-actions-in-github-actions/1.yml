name: Reusable Lint and Test
'on':
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install dependencies
      run: npm ci
    - name: Run linter
      run: npm run lint
    - name: Run test suite
      run: npm test
