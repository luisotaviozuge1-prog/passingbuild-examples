jobs:
  test:
    strategy:
      matrix:
        include:
        - node-version: 22
          os: ubuntu-latest
        - node-version: 24
          os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm test
'on': push
