name: CI
'on':
  push:
    branches:
    - main
  pull_request: null
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          frontend:
            - 'src/frontend/**'
            - 'package.json'
            - 'package-lock.json'
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: |
        npm ci
        npm test
