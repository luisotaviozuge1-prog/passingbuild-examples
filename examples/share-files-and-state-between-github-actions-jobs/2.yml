name: build-and-collect
'on': push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
        - linux
        - macos
        - windows
    steps:
    - uses: actions/checkout@v7
    - name: Build binary
      run: |
        mkdir -p dist
        echo "artifact for ${{ matrix.target }}" > dist/binary-${{ matrix.target }}.txt
    - uses: actions/upload-artifact@v7
      with:
        name: build-output-${{ matrix.target }}
        path: dist/
  aggregate:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: build-output-*
        path: all-builds/
        merge-multiple: true
    - name: Verify files
      run: ls -la all-builds/
