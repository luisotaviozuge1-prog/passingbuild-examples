jobs:
  generate_version:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.set_version.outputs.version }}
      environment: ${{ steps.set_env.outputs.target_env }}
    steps:
    - id: set_version
      run: echo "version=1.4.2" >> "$GITHUB_OUTPUT"
    - id: set_env
      run: echo "target_env=staging" >> "$GITHUB_OUTPUT"
  deploy:
    runs-on: ubuntu-latest
    needs: generate_version
    steps:
    - name: Print output values
      run: |
        echo "Deploying version ${{ needs.generate_version.outputs.build_version }}"
        echo "Target environment is ${{ needs.generate_version.outputs.environment }}"
'on': push
