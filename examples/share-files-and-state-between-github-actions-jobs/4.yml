name: example
'on': push
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
    - name: Restore pip cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
