name: Build and Deploy
'on':
  push:
    branches:
    - main
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Generate build metadata
      id: version
      run: |
        BUILD_TAG="v1.0.${{ github.run_number }}"
        echo "app_version=$BUILD_TAG" >> "$GITHUB_OUTPUT"
    - name: Build assets
      env:
        BUILD_TAG: ${{ steps.version.outputs.app_version }}
      run: |
        mkdir dist
        echo "Build artifacts for $BUILD_TAG" > dist/app.bundle.js
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-assets
        path: dist/
        retention-days: 1
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: build-assets
        path: dist/
    - name: Deploy package
      run: |
        echo "Deploying version ${{ needs.build.outputs.app_version }}"
        ls -la dist/
