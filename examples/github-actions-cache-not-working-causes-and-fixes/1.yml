name: example
'on': push
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Cache npm downloads
      id: npm-cache
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    - run: npm ci
