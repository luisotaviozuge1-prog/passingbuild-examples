name: 'fix-xcode-exit-code-65-in-github-actions-ios-builds #8'
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/ex-fix-xcode-exit-code-65-in-github-actions-ios-builds-8.yml
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
    - name: Run tests by simulator UDID
      run: |
        set -o pipefail
        DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '
          [.devices[][] | select(.name == "iPhone 15")] | first | .udid // empty
        ')

        if [ -z "$DEVICE_ID" ]; then
          echo "No available iPhone 15 simulator found"
          exit 1
        fi

        xcodebuild test \
          -project MyApp.xcodeproj \
          -scheme MyApp \
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
