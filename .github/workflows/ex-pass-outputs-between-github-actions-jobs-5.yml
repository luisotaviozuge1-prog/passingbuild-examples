name: 'pass-outputs-between-github-actions-jobs #5: dynamic-matrix'
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/ex-pass-outputs-between-github-actions-jobs-5.yml
jobs:
  job1:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - id: set-matrix
      run: |
        echo 'matrix={"include":[{"project":"foo","config":"Debug"},{"project":"bar","config":"Release"}]}' >> "$GITHUB_OUTPUT"
  job2:
    needs: job1
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.job1.outputs.matrix) }}
    steps:
    - run: echo "Project ${{ matrix.project }}, config ${{ matrix.config }}"
