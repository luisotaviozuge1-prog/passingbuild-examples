name: 'use-continue-on-error-in-github-actions-matrix-jobs #5: matrix-collect'
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/ex-use-continue-on-error-in-github-actions-matrix-jobs-5.yml
jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        node-version:
        - 18
        - 20
        experimental:
        - false
        include:
        - node-version: 22
          experimental: true
    steps:
    - run: echo "Testing on Node ${{ matrix.node-version }}"
  report:
    runs-on: ubuntu-latest
    needs:
    - test
    if: always()
    steps:
    - name: Report matrix result
      env:
        TEST_RESULT: ${{ needs.test.result }}
      run: echo "test result is $TEST_RESULT"
