name: 'use-continue-on-error-in-github-actions-matrix-jobs #2'
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/ex-use-continue-on-error-in-github-actions-matrix-jobs-2.yml
jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        node:
        - 18
        - 20
        os:
        - macos-latest
        - ubuntu-latest
        experimental:
        - false
        include:
        - node: 22
          os: ubuntu-latest
          experimental: true
    steps:
    - run: echo "Node ${{ matrix.node }} on ${{ matrix.os }}"
