name: 'how-to-reduce-github-actions-minutes-usage #6'
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/ex-how-to-reduce-github-actions-minutes-usage-6.yml
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/cache@v6
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-
