name: 'github-actions-secret-not-passed-to-script-causes-and-fixes #8: Mask Demo'
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/ex-github-actions-secret-not-passed-to-script-causes-and-fixes-8.yml
jobs:
  mask-demo:
    runs-on: ubuntu-latest
    steps:
    - name: Register mask and print value
      env:
        SESSION_VALUE: example-session-value
      run: |
        echo "::add-mask::$SESSION_VALUE"
        echo "Value is: $SESSION_VALUE"
